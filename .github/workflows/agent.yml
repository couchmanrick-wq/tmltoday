# Copy this file into each target project repo as .github/workflows/agent.yml
#
# The Rickster dashboard ("Prompt changes" on a project page) triggers this via
# workflow_dispatch with inputs: `prompt`, `agent` (claude | codex), and
# `attachments` (JSON array of {name,url} for screenshots/files, fetched into
# ./agent-attachments/ and removed before the PR). The chosen agent edits the
# working tree; peter-evans/create-pull-request opens the PR. Nothing is
# committed to the deploy branch directly.
#
# Secrets required on the repo (or org), depending on which agents you use:
#   ANTHROPIC_API_KEY   - for the "claude" option
#   OPENAI_API_KEY      - for the "codex" option
# You only need the secret for the agent(s) you actually pick.

name: Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: What should change in this project?
        required: true
        type: string
      agent:
        description: Which coding agent to use
        required: true
        default: claude
        type: choice
        options:
          - claude
          - codex
      attachments:
        description: JSON array of {name,url} files to fetch (set by the dashboard)
        required: false
        default: "[]"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fetch prompt attachments
        env:
          ATTACHMENTS: ${{ inputs.attachments }}
        run: |
          set -e
          mkdir -p agent-attachments
          printf '%s' "${ATTACHMENTS:-[]}" > /tmp/attachments.json
          count=$(jq 'length' /tmp/attachments.json)
          for i in $(seq 0 $((count - 1))); do
            name=$(jq -r ".[$i].name" /tmp/attachments.json | sed 's#[/\\]##g')
            url=$(jq -r ".[$i].url" /tmp/attachments.json)
            curl -fsSL "$url" -o "agent-attachments/$name"
            echo "  fetched $name"
          done
          if [ "$count" -gt 0 ]; then
            note="Reference files supplied with this request are in ./agent-attachments/ : $(ls agent-attachments | tr '\n' ' '). Consult them (screenshots, data, examples) to inform the change. Do not commit that folder."
          else
            note=""
          fi
          { echo "ATTACH_NOTE<<__RICKSTER_EOF__"; echo "$note"; echo "__RICKSTER_EOF__"; } >> "$GITHUB_ENV"

      - name: Apply requested change with Claude Code
        if: ${{ inputs.agent == 'claude' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          npx --yes @anthropic-ai/claude-code@latest \
            --print \
            --dangerously-skip-permissions \
            --max-turns 40 \
            "You are working in this repository. Apply the change described below.
             Keep it minimal and match existing code style and structure.
             If the project has a typecheck or test script, run it and make it pass.
             Do NOT commit, push, or open a pull request - only edit files in place.
             $ATTACH_NOTE

             CHANGE REQUEST:
             $PROMPT"

      - name: Apply requested change with OpenAI Codex
        if: ${{ inputs.agent == 'codex' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          npm install -g @openai/codex
          printenv OPENAI_API_KEY | codex login --with-api-key
          codex exec \
            --sandbox danger-full-access \
            --skip-git-repo-check \
            "You are working in this repository. Apply the change described below.
             Keep it minimal and match existing code style and structure.
             If the project has a typecheck or test script, run it and make it pass.
             Do NOT commit, push, or open a pull request - only edit files in place.
             $ATTACH_NOTE

             CHANGE REQUEST:
             $PROMPT"

      - name: Discard attachments so they are never committed
        if: always()
        run: rm -rf agent-attachments /tmp/attachments.json

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: agent/${{ github.run_id }}
          base: ${{ github.ref_name }}
          commit-message: "Agent (${{ inputs.agent }}): ${{ inputs.prompt }}"
          title: "Agent (${{ inputs.agent }}): ${{ inputs.prompt }}"
          body: |
            Requested via the Rickster dashboard.

            **Agent:** `${{ inputs.agent }}`

            **Prompt**

            > ${{ inputs.prompt }}

            Review before merging. Merging `${{ github.ref_name }}` runs `deploy.yml`.
          labels: agent
          delete-branch: true
